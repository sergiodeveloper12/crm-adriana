<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Adriana Froes - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Adriana Froes</h1>
        <p>CRM Consultora</p>

        <input 
            type="text" 
            id="usuario" 
            placeholder="Usuário">

        <input 
            type="password" 
            id="senha" 
            placeholder="Senha">

        <button onclick="login()">
            Entrar
        </button>

        <p id="mensagem"></p>

    </div>

</div>


<script src="script.js"></script>

</body>
</html>
